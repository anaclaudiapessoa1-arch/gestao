# Publica no GitHub Pages a cada envio para a main.
# O portão fica ANTES da publicação: se um teste falhar, o site no ar continua
# o anterior. Nenhum segredo entra aqui: os endereços do Supabase no código
# são públicos por design; quem autoriza é o crachá conferido no servidor.
name: Publicar (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A Gestão foi para dentro do painel MinasLab (leogpereira-afk/minaslab-painel,
      # pasta gestao/). Aqui só se publica a página que leva ao endereço novo,
      # mantendo o caminho depois do # (links de votação e de convites).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirecionar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
