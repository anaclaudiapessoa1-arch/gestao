# Confere cada envio: testes das regras (cálculos e soma do CRM) e build.
# Roda nos pull requests; a publicação fica em deploy.yml (push na main).
name: CI

on:
  pull_request: {}

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
